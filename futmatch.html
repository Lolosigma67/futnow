<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/futmatch.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('inicio') }}" class="logo"><i class="fas fa-futbol"></i> FutNow</a>

                        <li><i class="fas fa-map-marker-alt"></i> Palermo</li>
                    </ul>
                    <a href="https://wa.me/5491123456789" class="btn btn-ws" target="_blank"><i class="fab fa-whatsapp"></i> Contactar</a>
                </div>
            </article>

            <!-- Tarjeta 2 -->
            <article class="card-glass card-perfil">
                <div class="img-container">
                    <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80" alt="Jugador Alfonso">
                    <span class="badge-nivel avanzado">Avanzado</span>
                </div>
                <div class="info-perfil">
                    <h2>Alfonso <span class="edad">24 años</span></h2>
                    <ul class="datos">
                        <li><i class="fas fa-tshirt"></i> Arquero</li>
                        <li><i class="fas fa-map-marker-alt"></i> Belgrano</li>
                    </ul>
                    <a href="https://wa.me/5491123925941" class="btn btn-ws" target="_blank"><i class="fab fa-whatsapp"></i> Contactar</a>
                </div>
            </article>
        </div>
    </main>
</body>
</html>
